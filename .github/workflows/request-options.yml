name: Native API contract

on:
  pull_request:
  push:
    branches: [main, 'fix/truthful-request-options', 'fix/native-api-correctness', 'feat/native-prefix-cache']

permissions:
  contents: read

jobs:
  contract:
    # Keep Python 3.9 available; ubuntu-latest may select Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: PYTHONPATH=src python -m pytest tests -q -W error
      - run: git diff --check
